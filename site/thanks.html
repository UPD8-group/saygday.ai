<!doctype html>
<html lang="en-AU">
<head>
<!-- site:head -->
<title>Message sent · SayGday</title>
<meta name="description" content="Thanks for getting in touch with SayGday. We reply within one business day, usually sooner.">
<meta name="robots" content="noindex">
</head>
<body class="on-photo">
<!-- site:bar -->
<main id="main" class="page page--photo">
  <!-- Where the contact form lands when it's sent without JavaScript. With
       JavaScript, the contact page says thanks in place. -->
  <header class="photo-head photo-head--plain photo-head--legal photo-head--contact">
    <div class="photo-head__img photo-head__img--lift" role="img" aria-label="A glass building entrance at dusk, a revolving door at the top of wide steps and a stone wall reading Civic Quarter" style="--photo: url('/site/contact.webp'); --size-lift: auto 62%; --lift: 62%; --pos-lift: 85% top; --pos-wide: center 100%"></div>
    <div class="wrap photo-head__text">
      <p class="eyebrow">Message sent</p>
      <h1 class="title">Thanks.<br><em>We’ve got your message.</em></h1>
      <p class="intro">We’ll reply to the email address you gave us, within one business day, usually sooner.</p>
      <p><a class="btn btn--light" href="/">Back to the front page</a></p>
    </div>
    <div class="photo-head__credit wrap" aria-hidden="true"></div>
  </header>
</main>
<!-- site:foot -->
</body>
