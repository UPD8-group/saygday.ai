# The tests run before every build: a red test is a failed deploy, and the
# live site keeps its last good build.
[build]
  command = "npm test && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Previews use their isolated Supabase branch; production keeps the policy below.
[[context.deploy-preview.plugins]]
  package = "./plugins/preview-csp"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # The website scan's browser (netlify/functions/_lib/render.mjs): shipped as
  # packages, not bundled. Chromium itself is downloaded when a scan needs it.
  external_node_modules = ["puppeteer-core", "@sparticuz/chromium-min"]

# The public website is plain pages (site/, built to /pricing/index.html and
# so on); Netlify serves them and dist/404.html by themselves. The dashboard is
# one page that draws every /app address.
[[redirects]]
  from = "/app/*"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

# SayGday's own admin page (src/admin/), behind the password the server
# checks (SAYGDAY_ADMIN_PASSWORD, netlify/functions/_lib/admin.mjs).
[[redirects]]
  from = "/admin/*"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# The earlier platform's addresses, for when saygday.ai moves across.
[[redirects]]
  from = "/about"
  to = "/story"
  status = 301

# The public website: never framed, talk only to itself and Supabase sign-in.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://plcowhnsmrgenzsohbrl.supabase.co; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# The owner's app can open Stripe's secure card fields without leaving SayGday.
# Apply the same policy to every app entry point: client-side navigation can
# reach checkout from any of them. These specific rules override the global
# CSP; the public website and visitor chat keep their narrower policies.
# Stripe sources: https://docs.stripe.com/security/guide#content-security-policy
[[headers]]
  for = "/app"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://js.stripe.com https://*.js.stripe.com https://checkout.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.stripe.com https://*.link.com; connect-src 'self' https://plcowhnsmrgenzsohbrl.supabase.co https://api.stripe.com https://checkout.stripe.com https://link.com https://*.link.com; frame-src 'self' https://js.stripe.com https://*.js.stripe.com https://hooks.stripe.com https://checkout.stripe.com https://link.com https://*.link.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

[[headers]]
  for = "/app/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://js.stripe.com https://*.js.stripe.com https://checkout.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.stripe.com https://*.link.com; connect-src 'self' https://plcowhnsmrgenzsohbrl.supabase.co https://api.stripe.com https://checkout.stripe.com https://link.com https://*.link.com; frame-src 'self' https://js.stripe.com https://*.js.stripe.com https://hooks.stripe.com https://checkout.stripe.com https://link.com https://*.link.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

[[headers]]
  for = "/app.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://js.stripe.com https://*.js.stripe.com https://checkout.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.stripe.com https://*.link.com; connect-src 'self' https://plcowhnsmrgenzsohbrl.supabase.co https://api.stripe.com https://checkout.stripe.com https://link.com https://*.link.com; frame-src 'self' https://js.stripe.com https://*.js.stripe.com https://hooks.stripe.com https://checkout.stripe.com https://link.com https://*.link.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# The chat window opens inside any business's website, so it may be framed
# anywhere. It talks only to SayGday: its typeface is bundled, so no font
# request reaches Google from a business's visitors (4 October 2026).
[[headers]]
  for = "/chat.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors *; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Robots-Tag = "noindex"

# The admin page is never listed by a search engine (and, like every page
# but the chat window, never framed).
[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# The day-or-night choice, applied before each page paints.
[[headers]]
  for = "/theme.js"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/widget.js"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"
    Cross-Origin-Resource-Policy = "cross-origin"

[[headers]]
  for = "/characters/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=86400"
    Cross-Origin-Resource-Policy = "cross-origin"

# The photos the website opens on. They change rarely and a changed photo
# gets a new name, so a phone keeps them for a week instead of asking after
# every one on every visit (Netlify's default is max-age=0).
[[headers]]
  for = "/site/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"


[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

